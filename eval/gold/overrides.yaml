# Hand-curated facts that the spreadsheet does not carry.
# build_gold.py merges these with source/director_positions.xlsx.
#
# Why this file exists:
#   - The policy counts listed-company seats "anywhere in the world"; the sheet only has
#     "UK-listed company?". `orgs` below gives listed-anywhere status for every organisation
#     where a director holds a CURRENT role (the only rows that move votes).
#   - Roster keys (notice + resolution number) and PDF pages, so gold joins onto pipeline output.
#   - A few row-level corrections where a fact was checked outside the notices.
#
# Sources for every fact are in evidence.yaml, not here.

